<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Каталог книг - ReadMe</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container py-4">
    <h1 class="mb-4">Каталог книг</h1>

    <!-- Форма фильтрации -->
    <form method="get" class="row g-3 mb-4 p-3 border rounded bg-light">
        <div class="col-md-3">
            <label>Название</label>
            <input type="text" name="title" class="form-control" th:value="${title}">
        </div>
        <div class="col-md-3">
            <label>Автор</label>
            <input type="text" name="author" class="form-control" th:value="${author}">
        </div>
        <div class="col-md-2">
            <label>Жанр</label>
            <input type="text" name="genre" class="form-control" th:value="${genre}">
        </div>
        <div class="col-md-2">
            <label>Мин. страниц</label>
            <input type="number" name="minPages" class="form-control" th:value="${minPages}">
        </div>
        <div class="col-md-2">
            <label>Макс. страниц</label>
            <input type="number" name="maxPages" class="form-control" th:value="${maxPages}">
        </div>
        <div class="col-12">
            <button type="submit" class="btn btn-primary">Применить фильтры</button>
            <a href="/books" class="btn btn-secondary">Сбросить</a>
        </div>
    </form>

    <!-- Список книг (сетка) -->
    <div class="row row-cols-1 row-cols-md-3 g-4">
        <div th:each="book : ${books}" class="col">
            <div class="card h-100">
                <img th:src="${book.coverUrl ?: '/images/default-cover.jpg'}" class="card-img-top" alt="Обложка">
                <div class="card-body">
                    <h5 class="card-title" th:text="${book.title}"></h5>
                    <p class="card-text" th:text="${book.author}"></p>
                    <p class="card-text"><small class="text-muted">Жанр: <span th:text="${book.genre}"></span></small></p>
                    <p class="card-text"><small class="text-muted">Страниц: <span th:text="${book.pages}"></span></small></p>
                    <a th:href="@{/books/{id}(id=${book.id})}" class="btn btn-outline-primary">Подробнее</a>
                </div>
            </div>
        </div>
    </div>

    <div th:if="${books.isEmpty()}" class="alert alert-warning text-center">
        📚 Книги не найдены. Попробуйте изменить параметры фильтрации.
    </div>

    <!-- Пагинация -->
    <nav th:if="${totalPages > 0}" class="mt-4">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                <a class="page-link" th:href="@{?page=__${currentPage-1}__&size=12}">«</a>
            </li>
            <li th:each="i : ${#numbers.sequence(0, totalPages-1)}" class="page-item" th:classappend="${i == currentPage} ? 'active'">
                <a class="page-link" th:href="@{?page=__${i}__&size=12}" th:text="${i+1}"></a>
            </li>
            <li class="page-item" th:classappend="${currentPage == totalPages-1} ? 'disabled'">
                <a class="page-link" th:href="@{?page=__${currentPage+1}__&size=12}">»</a>
            </li>
        </ul>
    </nav>
</div>
</body>
</html>
