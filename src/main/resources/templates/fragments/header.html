<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<div th:fragment="header" class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container">
        <a class="navbar-brand logo" href="/">📖 ReadMe</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarMain">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item"><a class="nav-link" href="/posts">Лента</a></li>
                <li class="nav-item"><a class="nav-link" href="/books">Книги</a></li>
                <li sec:authorize="isAuthenticated()" class="nav-item"><a class="nav-link" href="/my-books">Мои книги</a></li>
                <li sec:authorize="isAuthenticated()" class="nav-item"><a class="nav-link" href="/my-discussions">Мои обсуждения</a></li>
                <li sec:authorize="isAuthenticated() and !hasRole('ROLE_ADMIN')" class="nav-item"><a class="nav-link" href="/my-suggestions">Мои предложения</a></li>
                <li sec:authorize="isAuthenticated() and !hasRole('ROLE_ADMIN')" class="nav-item"><a class="nav-link" href="/suggest-book">Предложить книгу</a></li>
                <li sec:authorize="hasRole('ROLE_ADMIN')" class="nav-item"><a class="nav-link" href="/admin/suggestions">Предложения книг</a></li>
                <li sec:authorize="hasRole('ROLE_ADMIN')" class="nav-item"><a class="nav-link" href="/admin/books">Импорт книг</a></li>
                <li sec:authorize="hasRole('ROLE_ADMIN')" class="nav-item"><a class="nav-link" href="/admin/popular-hashtags">Популярные хештеги</a></li>
            </ul>
            <ul class="navbar-nav ms-auto">
                <li sec:authorize="isAnonymous()" class="nav-item"><a class="nav-link" href="/login">Вход</a></li>
                <li sec:authorize="isAnonymous()" class="nav-item"><a class="nav-link" href="/register">Регистрация</a></li>
                <li sec:authorize="isAuthenticated()" class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
                        <i class="bi bi-person-circle"></i> <span sec:authentication="name">User</span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item" href="/posts/create">➕ Новый пост</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li>
                            <form th:action="@{/logout}" method="post" style="display: inline;">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <button type="submit" class="dropdown-item">🚪 Выйти</button>
                            </form>
                        </li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>
</div>
</html>
