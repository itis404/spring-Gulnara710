<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Редактирование поста</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .error { color: #dc3545; font-size: 0.875em; }
    </style>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<div class="container py-4">
    <h2>Редактировать пост</h2>
    <form th:action="@{/posts/{id}/update(id=${postId})}" th:object="${postForm}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div class="mb-3">
            <label>Заголовок</label>
            <input type="text" th:field="*{title}" class="form-control" th:classappend="${#fields.hasErrors('title')} ? 'is-invalid' : ''">
            <div th:if="${#fields.hasErrors('title')}" th:errors="*{title}" class="error"></div>
        </div>

        <div class="mb-3">
            <label>Текст</label>
            <textarea th:field="*{content}" class="form-control" rows="10"></textarea>
            <div th:if="${#fields.hasErrors('content')}" th:errors="*{content}" class="error"></div>
        </div>

        <div class="mb-3">
            <label>Хештеги (через запятую)</label>
            <input type="text" th:field="*{hashtagsInput}" class="form-control" placeholder="фантастика, книги">
        </div>

        <button type="submit" class="btn btn-success">Сохранить</button>
        <a href="/posts" class="btn btn-secondary">Отмена</a>
    </form>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
