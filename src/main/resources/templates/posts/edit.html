<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Редактирование поста</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
</head>
<body>
<div class="container py-4">
    <h2>Редактировать пост</h2>
    <form th:action="@{/posts/{id}/update(id=${post.id})}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <div class="mb-3">
            <label class="form-label">Заголовок</label>
            <input type="text" name="title" class="form-control" th:value="${post.title}">
        </div>
        <div class="mb-3">
            <label class="form-label">Текст</label>
            <textarea name="content" class="form-control" rows="10" required th:text="${post.content}"></textarea>
        </div>
        <div class="mb-3">
            <label class="form-label">Хештеги (через запятую)</label>
            <input type="text" name="hashtagsInput" class="form-control"
                   th:value="${#strings.listJoin(post.hashtags.![name], ', ')}">
        </div>
        <button type="submit" class="btn btn-success">Сохранить</button>
        <a href="/posts" class="btn btn-secondary">Отмена</a>
    </form>
</div>
</body>
</html>
