<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Новый пост</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container py-5">
    <h2>Создать новый пост</h2>

    <form th:action="@{/posts}" method="post">
        <div class="mb-3">
            <label class="form-label">Название поста (необязательно)</label>
            <input type="text" name="title" class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label">Текст поста</label>
            <textarea name="content" class="form-control" rows="10" required></textarea>
        </div>

        <!-- Новое поле для хештегов -->
        <div class="mb-3">
            <label class="form-label">Хештеги <small>(через запятую)</small></label>
            <input type="text" name="hashtagsInput" class="form-control"
                   placeholder="фантастика, книги, дюна">
        </div>

        <button type="submit" class="btn btn-success">Опубликовать пост</button>
        <a href="/posts" class="btn btn-secondary">Отмена</a>
    </form>
</div>
</body>
</html>
