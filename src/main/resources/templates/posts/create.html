<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Новый пост</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<div class="container py-4">
    <h2>Создать новый пост</h2>
    <form th:action="@{/posts}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <div class="mb-3"><label>Название</label><input type="text" name="title" class="form-control"></div>
        <div class="mb-3"><label>Текст</label><textarea name="content" class="form-control" rows="10" required></textarea></div>
        <div class="mb-3"><label>Хештеги (через запятую)</label><input type="text" name="hashtagsInput" class="form-control" placeholder="фантастика, книги"></div>
        <button type="submit" class="btn btn-success">Опубликовать</button>
        <a href="/posts" class="btn btn-secondary">Отмена</a>
    </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
