<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Популярные хештеги - ReadMe</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<div class="container py-4">
    <h2>Популярные хештеги (количество постов выше среднего)</h2>
    <p class="text-muted">Результат запроса с подзапросом (subselect)</p>
    <table class="table table-striped">
        <thead>
        <tr>
            <th>Хештег</th>
            <th>Количество постов</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="h : ${hashtags}">
            <td>#<span th:text="${h.name}"></span></td>
            <td th:text="${h.postCount}"></td>
        </tr>
        <tr th:if="${hashtags.isEmpty()}">
            <td colspan="2">Нет данных</td>
        </tr>
        </tbody>
    </table>
    <a href="/admin/suggestions" class="btn btn-secondary">Назад к предложениям</a>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
