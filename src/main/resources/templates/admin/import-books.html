<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Импорт книг из Google Books</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
</head>
<body>
<div class="container py-4">
    <h1>Импорт книг из Google Books</h1>
    <div class="row mt-3">
        <div class="col-md-6">
            <div class="input-group">
                <input type="text" id="searchQuery" class="form-control" placeholder="Название книги или автор...">
                <button id="searchBtn" class="btn btn-primary">Поиск</button>
            </div>
        </div>
    </div>
    <div id="results" class="row mt-4"></div>
</div>

<script>
    const csrfToken = document.querySelector('meta[name="_csrf"]')?.content;
    const csrfHeader = document.querySelector('meta[name="_csrf_header"]')?.content;

    document.getElementById('searchBtn').addEventListener('click', async () => {
        const query = document.getElementById('searchQuery').value.trim();
        if (!query) return;
        const response = await fetch(`/api/books/google/search?q=${encodeURIComponent(query)}`, {
            headers: { 'X-Requested-With': 'XMLHttpRequest' }
        });
        if (response.ok) {
            const books = await response.json();
            const container = document.getElementById('results');
            container.innerHTML = books.map(book => `
                <div class="col-md-4 mb-3">
                    <div class="card h-100">
                        <img src="${book.coverUrl || '/images/default-cover.jpg'}" class="card-img-top" style="height: 200px; object-fit: contain;">
                        <div class="card-body">
                            <h5 class="card-title">${book.title}</h5>
                            <p class="card-text">${book.author}</p>
                            <button class="btn btn-sm btn-success import-btn" data-book='${JSON.stringify(book)}'>Импортировать</button>
                        </div>
                    </div>
                </div>
            `).join('');
            document.querySelectorAll('.import-btn').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    const book = JSON.parse(btn.getAttribute('data-book'));
                    const response = await fetch('/api/books/google/import', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-Requested-With': 'XMLHttpRequest',
                            [csrfHeader]: csrfToken
                        },
                        body: JSON.stringify(book)
                    });
                    if (response.ok) {
                        alert('Книга импортирована!');
                        btn.disabled = true;
                        btn.textContent = 'Импортировано';
                    } else {
                        alert('Ошибка импорта');
                    }
                });
            });
        }
    });
</script>
</body>
</html>
