<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Мои книги - ReadMe</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container py-4">
    <h1 class="mb-4">Мои книги</h1>

    <ul class="nav nav-tabs" id="bookTab" role="tablist">
        <li class="nav-item" role="presentation">
            <button class="nav-link active" id="wishlist-tab" data-bs-toggle="tab" data-bs-target="#wishlist" type="button" role="tab">Избранное</button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" id="read-tab" data-bs-toggle="tab" data-bs-target="#read" type="button" role="tab">Прочитано</button>
        </li>
    </ul>
    <div class="tab-content mt-3" id="bookTabContent">
        <div class="tab-pane fade show active" id="wishlist" role="tabpanel">
            <div th:if="${wishlist.isEmpty()}" class="alert alert-info">Нет книг в избранном</div>
            <div class="row row-cols-1 row-cols-md-3 g-4">
                <div th:each="book : ${wishlist}" class="col">
                    <div class="card h-100">
                        <img th:src="${book.coverUrl ?: '/images/default-cover.jpg'}" class="card-img-top">
                        <div class="card-body">
                            <h5 class="card-title" th:text="${book.title}"></h5>
                            <p class="card-text" th:text="${book.author}"></p>
                            <a th:href="@{/books/{id}(id=${book.id})}" class="btn btn-sm btn-primary">Подробнее</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="tab-pane fade" id="read" role="tabpanel">
            <div th:if="${read.isEmpty()}" class="alert alert-info">Нет прочитанных книг</div>
            <div class="row row-cols-1 row-cols-md-3 g-4">
                <div th:each="book : ${read}" class="col">
                    <div class="card h-100">
                        <img th:src="${book.coverUrl ?: '/images/default-cover.jpg'}" class="card-img-top">
                        <div class="card-body">
                            <h5 class="card-title" th:text="${book.title}"></h5>
                            <p class="card-text" th:text="${book.author}"></p>
                            <a th:href="@{/books/{id}(id=${book.id})}" class="btn btn-sm btn-primary">Подробнее</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
