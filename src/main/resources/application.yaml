spring:
  application:
    name: ReadMe

  datasource:
    url: jdbc:postgresql://localhost:5433/readme_db
    username: readme_user
    password: readme_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 20

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8

  cache:
    type: redis
    redis:
      time-to-live: 600000   # 10 минут
      cache-null-values: false

  thymeleaf:
    cache: false
    mode: HTML

logging:
  level:
    ru.itis: DEBUG
    org.springframework.security: INFO
  file:
    name: logs/readme.log
    max-size: 10MB
    max-history: 30

server:
  port: 8081
  error:
    include-message: always
    include-binding-errors: always

app:
  google-books:
    api-url: https://www.googleapis.com/books/v1/volumes
    api-key: AIzaSyALS-1fYWqBc9pIkLtWFqoBaFCMIcSPTsY
  github:
    oauth:
      client-id: ${GITHUB_CLIENT_ID:your_client_id_here}
      client-secret: ${GITHUB_CLIENT_SECRET:your_secret_here}
      redirect-uri: ${GITHUB_REDIRECT_URI:http://localhost:8080/oauth2/github/callback}
