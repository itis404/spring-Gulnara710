spring:
  application:
    name: ReadMe

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/readme_db}
    username: ${SPRING_DATASOURCE_USERNAME:readme_user}
    password: ${SPRING_DATASOURCE_PASSWORD:readme_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 20

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8

  cache:
    type: redis
    redis:
      time-to-live: 600000
      cache-null-values: false

  thymeleaf:
    cache: false
    mode: HTML

logging:
  level:
    ru.itis: DEBUG
    org.springframework.security: INFO
  file:
    name: logs/readme.log
    max-size: 10MB
    max-history: 30

server:
  port: 8082
  error:
    include-message: always
    include-binding-errors: always

app:
  google-books:
    api-url: https://www.googleapis.com/books/v1/volumes
    api-key: ${GOOGLE_BOOKS_API_KEY:AIzaSyALS-1fYWqBc9pIkLtWFqoBaFCMIcSPTsY}
  github:
